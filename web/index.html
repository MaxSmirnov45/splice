<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="splice">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>splice</title>
  <link rel="manifest" href="manifest.json">
  <!-- Poki SDK. Loaded ahead of the engine so PokiSDK exists before the game
       initialises. The game checks for it and runs normally without it, so a
       local build or any other host still works. -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <style>
    /* Required by portal guidelines for mobile: a game canvas must not be
       selectable, must not show tap highlights or iOS callout menus, and must
       not let a swipe scroll or pull-to-refresh the host page instead of
       reaching the game. */
    html, body { margin: 0; padding: 0; overflow: hidden; background: #05060D; }
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }
  </style>
  <script>
    // Flutter web delivers key events to its view element, not the document.
    // If that element never takes focus — a fresh page load, or the player
    // clicking browser chrome first — WASD silently goes nowhere while touch
    // and mouse keep working, which is exactly the reported symptom.
    //
    // Grab focus once the view exists, and again on any pointer interaction.
    (function ensureGameFocus() {
      function focusView() {
        var v = document.querySelector('flutter-view') ||
                document.querySelector('flt-glass-pane') ||
                document.body;
        if (v && typeof v.focus === 'function') {
          if (v.getAttribute && v.getAttribute('tabindex') === null) {
            v.setAttribute('tabindex', '-1');
          }
          v.focus({ preventScroll: true });
        }
      }
      window.addEventListener('load', function () { setTimeout(focusView, 300); });
      // Portals embed the game in an iframe, where focus follows the first
      // interaction rather than the load.
      ['pointerdown', 'touchstart', 'click'].forEach(function (evt) {
        window.addEventListener(evt, focusView, { passive: true });
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
